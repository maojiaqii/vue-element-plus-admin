<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="40" viewBox="0 0 300 40" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="5" width="290" height="30" rx="6" fill="none" stroke="#409EFF" stroke-width="2"/>

    <!-- 图片占位（山峰 + 太阳） -->
    <polygon points="32,28 38,20 44,26 48,18 56,28" fill="#C0C4CC" opacity="0.6"/>
    <circle cx="64" cy="16" r="3" fill="#C0C4CC" opacity="0.6"/>

    <!-- 裁剪框（虚线） -->
    <rect x="40" y="12" width="50" height="16" rx="2" fill="none" stroke="#409EFF" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- 裁剪网格 3x3 -->
    <!-- 垂直网格线 -->
    <line x1="56.6667" y1="12" x2="56.6667" y2="28" stroke="#A0CFFF" stroke-width="1"/>
    <line x1="73.3333" y1="12" x2="73.3333" y2="28" stroke="#A0CFFF" stroke-width="1"/>
    <!-- 水平网格线 -->
    <line x1="40" y1="17.3333" x2="90" y2="17.3333" stroke="#A0CFFF" stroke-width="1"/>
    <line x1="40" y1="22.6667" x2="90" y2="22.6667" stroke="#A0CFFF" stroke-width="1"/>

    <!-- 裁剪手柄（8 个） -->
    <!-- 四角 -->
    <rect x="38" y="10" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>
    <rect x="88" y="10" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>
    <rect x="38" y="28" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>
    <rect x="88" y="28" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>
    <!-- 边中 -->
    <rect x="63" y="10" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>
    <rect x="63" y="28" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>
    <rect x="38" y="19" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>
    <rect x="88" y="19" width="4" height="4" fill="#FFFFFF" stroke="#409EFF"/>

    <rect x="140" y="8" width="40" height="24" rx="4" fill="#409EFF" stroke="#E4E7ED"/>

    <!-- 预览内容（缩略的裁剪结果） -->
    <rect x="146" y="12" width="28" height="16" rx="2" fill="#ECF5FF" stroke="#409EFF"/>
    <!-- 简化网格 -->
    <line x1="155.3333" y1="12" x2="155.3333" y2="28" stroke="#A0CFFF" stroke-width="1"/>
    <line x1="164.6667" y1="12" x2="164.6667" y2="28" stroke="#A0CFFF" stroke-width="1"/>
    <line x1="146" y1="17.3333" x2="174" y2="17.3333" stroke="#A0CFFF" stroke-width="1"/>
    <line x1="146" y1="22.6667" x2="174" y2="22.6667" stroke="#A0CFFF" stroke-width="1"/>

    <!-- 缩略图占位（与左侧风格一致） -->
    <polygon points="150,26 155,18 160,24 164,16 170,26" fill="#C0C4CC" opacity="0.6"/>
    <text x="285" y="23" text-anchor="end" font-size="12" fill="#409EFF">ImageCropping</text>
</svg>