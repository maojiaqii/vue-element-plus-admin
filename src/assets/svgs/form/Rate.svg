<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="40" viewBox="0 0 300 40" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景透明，适配预览容器 -->
    <rect x="5" y="5" width="290" height="30" rx="6" fill="none" stroke="#409EFF" stroke-width="2"/>
    <!-- 半星裁剪：左半部分 -->
    <defs>
        <clipPath id="halfLeft">
            <rect x="-12" y="-12" width="12" height="24" />
        </clipPath>
    </defs>

    <!-- 星形（使用相同的点坐标，通过位移排列） -->
    <!-- 颜色参考 Element Plus：填充 #409EFF / 边框 #409EFF；未选中边框 #C0C4CC -->
    <!-- Star 1：实心 -->
    <g transform="translate(20,20)">
        <polygon
                points="0,-9 2.6,-1.8 9.5,-1.8 4,2.3 6.2,8.8 0,5.2 -6.2,8.8 -4,2.3 -9.5,-1.8 -2.6,-1.8"
                fill="#409EFF"
                stroke="#409EFF"
                stroke-linejoin="round"
        />
    </g>

    <!-- Star 2：实心 -->
    <g transform="translate(60,20)">
        <polygon
                points="0,-9 2.6,-1.8 9.5,-1.8 4,2.3 6.2,8.8 0,5.2 -6.2,8.8 -4,2.3 -9.5,-1.8 -2.6,-1.8"
                fill="#409EFF"
                stroke="#409EFF"
                stroke-linejoin="round"
        />
    </g>

    <!-- Star 3：实心 -->
    <g transform="translate(100,20)">
        <polygon
                points="0,-9 2.6,-1.8 9.5,-1.8 4,2.3 6.2,8.8 0,5.2 -6.2,8.8 -4,2.3 -9.5,-1.8 -2.6,-1.8"
                fill="#409EFF"
                stroke="#409EFF"
                stroke-linejoin="round"
        />
    </g>

    <!-- Star 4：半星（左半填充，右半空心） -->
    <g transform="translate(140,20)">
        <!-- 空心底座 -->
        <polygon
                points="0,-9 2.6,-1.8 9.5,-1.8 4,2.3 6.2,8.8 0,5.2 -6.2,8.8 -4,2.3 -9.5,-1.8 -2.6,-1.8"
                fill="none"
                stroke="#C0C4CC"
                stroke-linejoin="round"
        />
        <!-- 左半填充 -->
        <polygon
                points="0,-9 2.6,-1.8 9.5,-1.8 4,2.3 6.2,8.8 0,5.2 -6.2,8.8 -4,2.3 -9.5,-1.8 -2.6,-1.8"
                fill="#409EFF"
                stroke="#409EFF"
                stroke-linejoin="round"
                clip-path="url(#halfLeft)"
        />
    </g>

    <!-- Star 5：空心 -->
    <g transform="translate(180,20)">
        <polygon
                points="0,-9 2.6,-1.8 9.5,-1.8 4,2.3 6.2,8.8 0,5.2 -6.2,8.8 -4,2.3 -9.5,-1.8 -2.6,-1.8"
                fill="none"
                stroke="#C0C4CC"
                stroke-linejoin="round"
        />
    </g>
    <text x="285" y="25" text-anchor="end" font-size="12" fill="#409EFF">Rate</text>
</svg>